# ============================================================
# ===== F1 APEX · APPLICATION PROPERTIES ====================
# ============================================================

# ===== SERVEUR =====
server.port=${PORT:8000}
spring.application.name=f1analytics

# ===== BASE DE DONNÉES =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== ✅ HIKARICP (connection pool) — CRUCIAL =====
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=F1ApexPool

# ===== ✅ JPA / HIBERNATE — PERFORMANCE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# ✅ Désactive aussi le formatage SQL (coûteux)
spring.jpa.properties.hibernate.format_sql=false

# ✅ BATCH + FETCH SIZES
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true


# ===== JWT =====
jwt.secret=MaCleSecreteTresLonguePourF1Analytics2026ChangeLaVite!
jwt.expiration=86400000

# ===== UPLOAD FICHIERS =====
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===== OPEN-IN-VIEW (doit rester false) =====
spring.jpa.open-in-view=false

# ============================================================
# ===== ✅ COMPRESSION gzip — CRUCIAL ========================
# ============================================================
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,image/svg+xml

